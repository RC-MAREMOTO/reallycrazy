<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tactical Strike 2</title>
<style>
:root{--bg:#0e1115;--panel:#161a1f;--panel2:#1d2229;--line:#2b323b;--gold:#f0b429;--green:#6bb21b;--txt:#e8ecef;--mut:#8b95a1;--blue:#5aa0ff;--red:#e5483b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Rajdhani","Bahnschrift","Arial Narrow",Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0}
/* ---------- MENU ---------- */
#menu{background:linear-gradient(180deg,rgba(8,10,13,.78),rgba(8,10,13,.9));display:flex;flex-direction:column;z-index:20}
#nav{display:flex;align-items:center;gap:6px;padding:6px 14px;background:linear-gradient(#000a,#0000);border-bottom:1px solid var(--line)}
#nav .logo{font-weight:700;letter-spacing:2px;font-size:15px;margin-right:auto}
#nav .logo b{color:var(--gold)}
#nav button{background:none;border:0;color:var(--mut);font-weight:700;font-size:13px;font-family:inherit;letter-spacing:1.5px;padding:8px 12px;border-bottom:2px solid transparent}
#nav button.on{color:#fff;border-color:var(--gold)}
#nav .off{margin-left:auto;font-size:10px;color:var(--mut)}
#menuMain{flex:1;overflow:auto;padding:10px 14px;touch-action:pan-y}
h2{margin:0 0 6px;font-size:20px;letter-spacing:2px}
h2 small{font-size:11px;color:var(--mut);letter-spacing:0;margin-left:8px;font-weight:500}
.maps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.maps{padding:6px 4px 10px}
.map{flex:0 0 135px;height:100px;border:2px solid #ffffff1f;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(160deg,#39424e,#171b20);display:flex;flex-direction:column;justify-content:flex-end;opacity:.6;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.map .mi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.map::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000d 0%,#0008 32%,transparent 62%);pointer-events:none}
.map.ok{opacity:1}
.map:hover .mi,.map.sel .mi{transform:scale(1.12)}
.map.sel{border-color:var(--gold);box-shadow:0 0 14px #ffc83dbb,inset 0 0 10px #ffc83d55;transform:translateY(-2px)}
.map b{position:relative;z-index:2;font-size:14px;letter-spacing:1px;padding:0 8px;text-shadow:0 1px 4px #000}
.map i{position:relative;z-index:2;font-style:normal;font-size:9px;color:#cbd3da;padding:0 8px 6px}
.map em{position:absolute;z-index:2;top:5px;right:5px;font-style:normal;font-size:8px;background:#0009;padding:2px 6px;letter-spacing:1px;border-radius:8px}
.map.ok em{background:var(--green);color:#fff}
.mcards{display:flex;gap:8px}
.mcard{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;font-family:inherit;color:#8a929c;font-weight:700;font-size:11px;letter-spacing:1.5px;background:linear-gradient(#262c34,#12151a);border:2px solid #ffffff1a;border-radius:10px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.mcard .ic{font-size:30px;line-height:1.1;filter:grayscale(1) brightness(.75);transition:filter .2s}
.mcard.on{transform:translateY(-4px);border-color:var(--gold);color:var(--gold);background:radial-gradient(circle at 50% 0,#6b4f1a 0,#2a2415 60%,#14110a);box-shadow:0 6px 16px #ffc83d44,0 0 14px #ffc83d55}
.mcard.on .ic{filter:none;text-shadow:0 0 12px #ffc83d}
#teamSel{position:fixed;inset:0;z-index:99990;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 30%,#2a313b 0,#12161c 55%,#06080b 100%);animation:tsIn .3s}
@keyframes tsIn{from{opacity:0}to{opacity:1}}
#teamSel h1{margin:0;font-size:clamp(16px,3.4vw,26px);letter-spacing:6px;color:#fff}
#teamSel .tsr{display:flex;gap:min(4vw,28px);height:min(66vh,380px)}
.tsc{position:relative;width:min(36vw,250px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:3px solid var(--tc);border-radius:14px;background:linear-gradient(to top,color-mix(in srgb,var(--tc) 30%,#000),#0b0e12 70%);cursor:pointer;overflow:hidden;box-shadow:0 0 18px color-mix(in srgb,var(--tc) 35%,transparent);transition:transform .35s,opacity .35s,box-shadow .35s,filter .35s;padding-bottom:10px}
.tsc img{position:absolute;left:50%;top:2%;height:76%;transform:translateX(-50%);filter:drop-shadow(0 6px 10px #000c);pointer-events:none}
.tsc b{position:relative;font-size:clamp(13px,2.6vw,19px);letter-spacing:2px;color:var(--tc);text-shadow:0 1px 6px #000}
.tsc small{position:relative;font-size:clamp(10px,1.8vw,12px);color:#cbd3da;margin-top:2px}
.tsc:hover{transform:translateY(-4px)}
.tsc.pick{transform:scale(1.07);box-shadow:0 0 44px var(--tc),0 0 90px color-mix(in srgb,var(--tc) 55%,transparent)}
.tsc.fade{opacity:0;transform:scale(.9);filter:grayscale(1);pointer-events:none}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:8px}
.opt label{display:block;font-size:10px;color:var(--mut);letter-spacing:1.5px;margin-bottom:3px}
.chips{display:flex;gap:4px}
.chip{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:12px;font-family:inherit;padding:8px 4px;letter-spacing:1px}
.chip.on{border-color:var(--gold);color:var(--gold);background:#2a2415}
.cta{position:fixed;right:14px;bottom:12px;background:var(--green);border:0;color:#fff;font-weight:700;font-size:20px;font-family:inherit;letter-spacing:3px;padding:12px 30px;z-index:21}
.panel{max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{background:none;border:0;color:var(--mut);font-weight:700;font-size:12px;font-family:inherit;letter-spacing:1.5px;padding:6px 0;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.row .v{color:var(--gold);font-size:12px;min-width:34px;text-align:right}
.row input[type=range]{flex:1;max-width:210px;accent-color:var(--gold)}
.row select,.row input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:5px;font-family:inherit;font-size:13px;width:150px;-webkit-user-select:text;user-select:text}
.sw{width:40px;height:22px;border-radius:11px;background:#444;position:relative;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:20px}
.cols{display:flex;gap:6px}.cols i{width:20px;height:20px;border:2px solid transparent}.cols i.on{border-color:#fff}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:12px;font-family:inherit;letter-spacing:1px;padding:9px 14px}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.foot{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.item{background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--rc);padding:5px}
.item.eq{outline:1px solid #cfd8e2}
.item .sk{height:42px;border-radius:2px;margin-bottom:4px;display:flex;align-items:center;justify-content:center}
.item .sk span{display:block;height:9px;border-radius:2px}
.item small{display:block;color:var(--mut);font-size:9px}
.item b{font-size:13px;display:block}
.item .bb{display:flex;gap:3px;margin-top:4px}.item .bb button{flex:1;background:#232a32;border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:9px;font-family:inherit;padding:4px 0}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:280px;text-align:center}
/* ---------- LOBBY ---------- */
#menu.lobby{background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 24%,transparent 64%,rgba(0,0,0,.4)),linear-gradient(0deg,rgba(0,0,0,.6),transparent 34%)}
#menu.lobby #nav{background:linear-gradient(#000c,#0000);border-bottom-color:#ffffff14}
#nav button sup{display:block;font-size:7px;line-height:1;background:var(--gold);color:#111;padding:1px 4px;margin:1px auto 0;letter-spacing:.5px;width:max-content}
#menuMain.lb{padding:0;overflow:hidden;position:relative;touch-action:none}
#lbDrag{position:absolute;left:30%;right:26%;top:0;bottom:0;touch-action:none;cursor:grab}
#lbName{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);text-align:center;text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none}
#lbName small{display:block;font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:700}
#lbName b{font-size:20px;letter-spacing:2px}
#lbName i{display:block;font-style:normal;font-size:9px;color:#cfd6dd;opacity:.8;margin-top:1px}
#lbRight{position:absolute;right:12px;top:8px;width:min(236px,29vw);display:flex;flex-direction:column;gap:6px}
.pcard,.pstats,.eqcard{background:rgba(16,20,25,.84);border:1px solid #ffffff1c;box-shadow:0 2px 10px #0006}
.pcard .pid{color:var(--green);font-weight:700;letter-spacing:1px;justify-content:flex-start;margin:1px 0 2px}
.pcard{display:flex;gap:9px;align-items:center;padding:8px}
.pcard .av{flex:0 0 42px;height:42px;background:linear-gradient(#ffc83d,#d99a12);color:#1a1200;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.pcard .pi{flex:1;min-width:0}.pcard b{font-size:17px;display:block;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{color:var(--mut);font-size:10px;display:flex;justify-content:space-between;letter-spacing:.5px}
.xp{height:4px;background:#ffffff1f;margin:4px 0 3px;border-radius:2px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#6bb21b,#a6e04a)}
.pstats{display:grid;grid-template-columns:repeat(4,1fr)}
.pstats div{text-align:center;padding:6px 0 5px;border-right:1px solid #ffffff14}.pstats div:last-child{border:0}
.pstats b{display:block;font-size:19px;line-height:1}.pstats small{font-size:8px;letter-spacing:1.2px;color:var(--mut)}
.eqcard{padding:7px 9px 8px}.eqcard>small{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:700}
.eqcard .wp{height:46px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a323c,#12161b)}
.wp span{display:block;width:96px;height:11px;border-radius:3px;box-shadow:0 0 12px #0008}
.eqcard b{font-size:12px;display:block;text-align:right;color:#cfd6dd;font-weight:600;margin-top:3px}
.play{border:0;color:#fff;padding:11px 8px 9px;font-family:inherit;text-align:center;background:linear-gradient(#7dcc22,#559412);box-shadow:inset 0 1px 0 #ffffff55,0 0 0 1px #a4e85055,0 6px 18px #0009;animation:glow 2.4s ease-in-out infinite}
.play b{display:block;font-size:26px;letter-spacing:5px;line-height:1}.play small{display:block;font-size:9px;letter-spacing:2px;opacity:.9;margin-top:3px}
.play:active{filter:brightness(1.15)}
.pcard{cursor:pointer}.pcard:active{filter:brightness(1.2)}
.playrow{display:flex;gap:6px;align-items:stretch}.playrow .play{flex:1;min-width:0}.playrow .play b{font-size:22px;letter-spacing:3px}
.rkbtn{flex:0 0 64px;background:rgba(16,20,25,.84);border:1px solid #ffffff1c;box-shadow:0 2px 10px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-family:inherit;cursor:pointer}
.rkbtn small{font-size:8px;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.1}.rkbtn:active{filter:brightness(1.3)}
.rkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.rkc{background:linear-gradient(#1a2029,#10141a);border:1px solid #ffffff14;border-top:3px solid var(--rc);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:4px}
.rkc b{font-size:11px;letter-spacing:.5px}.rkc small{font-size:9px;color:var(--mut)}.rkc.cur{outline:2px solid var(--gold);box-shadow:0 0 12px #f0b42966}.rkc.lock{opacity:.5}
.lb-row.me{background:linear-gradient(90deg,#f0b42933,#f0b4290d);border:1px solid var(--gold);border-left-width:4px}.lb-rp{white-space:nowrap;min-width:84px;text-align:right}.lb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .box{touch-action:pan-y}.rkscroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes glow{50%{box-shadow:inset 0 1px 0 #ffffff55,0 0 0 1px #a4e85099,0 0 22px #6bb21b88}}
#lbLeft{position:absolute;left:10px;bottom:10px;width:min(200px,27vw);display:flex;flex-direction:column;gap:6px}
.mcard,.ncard{background:rgba(16,20,25,.88);border:1px solid #ffffff1c;box-shadow:0 2px 10px #0006;overflow:hidden;position:relative}
.mcard .th{height:58px;position:relative;background:linear-gradient(#78a8dc 0,#d9d1b5 62%,#9a6f38 63%,#4a3318)}
.mcard .th::before{content:"";position:absolute;left:50%;bottom:0;width:46px;height:38px;margin-left:-23px;background:#c9954b}
.mcard .th::after{content:"";position:absolute;left:50%;bottom:0;width:28px;height:26px;margin-left:-14px;background:#4f3314;border-radius:14px 14px 0 0}
.mcard .th i{position:absolute;right:20px;bottom:0;width:3px;height:34px;background:#4a3320}.mcard .th i::before{content:"";position:absolute;left:-9px;top:-3px;width:21px;height:6px;background:#3a8a2e;border-radius:6px 6px 0 0}
.mcard .th b{position:absolute;left:7px;bottom:4px;font-size:20px;letter-spacing:1px;text-shadow:0 1px 4px #000;z-index:2}
.mcard .th small{position:absolute;left:7px;top:4px;font-size:8px;letter-spacing:1.5px;background:#000a;padding:1px 4px;color:var(--gold);font-weight:700;z-index:2}
.mcard>i,.ncard small{display:block;font-style:normal;font-size:9px;color:var(--mut);padding:4px 7px}
.ncard{display:flex;align-items:center;gap:7px;padding:5px 7px}.ncard .wp{flex:0 0 62px;height:34px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a323c,#12161b)}
.ncard .wp span{width:50px;height:8px}.ncard div small{padding:0;color:var(--gold);letter-spacing:1.5px;font-weight:700;font-size:8px}
.ncard div b{display:block;font-size:12px;line-height:1.1;margin-top:1px}.ncard div i{font-style:normal;font-size:8px;color:#e5483b}
.back{float:right;font-size:11px}
.eqw{display:flex;gap:12px;align-items:flex-start}.eqw>div:first-child{flex:1}
.ag-h{font-size:10px;letter-spacing:2px;font-weight:700;margin:8px 0 5px}
.ags{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}
.ag{position:relative;background:linear-gradient(#1c2229,#12161b);border:1px solid var(--line);padding:6px 4px;text-align:center}
.ag.eq{border-color:var(--gold);box-shadow:0 0 12px #f0b42933}
.ag em{position:absolute;top:3px;right:3px;font-size:8px;background:var(--green);color:#fff;padding:1px 5px;font-style:normal;letter-spacing:1px}
.ag b{display:block;font-size:13px}.ag small{display:block;font-size:9px;color:var(--mut);line-height:1.2;margin-top:2px}
.fig{position:relative;width:34px;height:66px;margin:0 auto 5px}.fig i{position:absolute;display:block}
.arsenal{flex:0 0 min(190px,26vw)}
.ar{display:flex;align-items:center;gap:7px;background:var(--panel);border-left:3px solid var(--gold);padding:5px 7px;margin-bottom:4px}
.ar span{flex:0 0 36px;height:8px;border-radius:2px}.ar b{font-size:12px;display:block;line-height:1}.ar small{font-size:9px;color:var(--mut)}
.item .sk{background:radial-gradient(#2c343e,#12161b)}.item .sk img{max-width:100%;max-height:100%;object-fit:contain}.item .sk{height:56px}
.wp img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px #000a)}.eqcard .wp{height:60px}.ncard .wp img,.ar span img{width:100%;height:100%;object-fit:contain}
.ar span{flex:0 0 64px;height:30px;border-radius:0;background:radial-gradient(#2a323c,#12161b)}
.ag .fg{height:80px;display:block;margin:0 auto 4px;filter:drop-shadow(0 4px 6px #000a)}
.insp .ib{background:linear-gradient(#171c22,#0e1115);border:1px solid var(--line);padding:12px 16px;text-align:center;max-width:94vw}
.insp .ih{display:flex;gap:10px;align-items:center;justify-content:center;text-align:left}.insp .ic{width:34px;height:34px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:18px}
.insp .ih b{font-size:20px;display:block;line-height:1}.insp .idesc{font-size:11px;color:var(--mut);margin:6px auto;max-width:430px}
.insp canvas{display:block;margin:4px auto;background:radial-gradient(#2a323c,#0e1115);touch-action:none}
.insp .ibt{display:flex;gap:8px;justify-content:center;margin-top:6px}.insp .ihint{display:block;font-size:9px;color:var(--mut);margin-top:4px}

/* ---- Inspecionar Perfil (estilo cartão de jogador) ---- */
.pfm{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(4,6,9,.8);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:pfIn .18s ease-out}
@keyframes pfIn{from{opacity:0}to{opacity:1}}
.pfm .pb{position:relative;width:min(94vw,880px);height:min(90vh,540px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:linear-gradient(120deg,rgba(24,29,35,.94),rgba(10,12,15,.9));border:1px solid #ffffff1f;box-shadow:0 10px 40px #000a;overflow:hidden}
.pfm .pb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);z-index:2}
.pf-l{padding:14px 18px 14px 20px;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:auto}
.pf-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ffffff14;padding-bottom:6px}
.pf-h b{font-size:15px;letter-spacing:2px}.pf-h small{color:var(--mut);font-size:9px;letter-spacing:1.5px}
.pf-f{background:rgba(255,255,255,.04);border:1px solid #ffffff14;padding:6px 10px}
.pf-f label{display:block;font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-bottom:1px}
.pf-f small{display:block;color:var(--mut);font-size:9px;margin-top:2px}
.pf-v{font-size:18px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-id{color:var(--green);letter-spacing:2px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pf-id i{font-style:normal;font-size:9px;color:var(--mut);letter-spacing:1px;font-weight:400}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pf-xp{height:4px;background:#ffffff18;margin:5px 0 1px}.pf-xp i{display:block;height:100%;background:var(--green)}
.pf-f textarea{display:block;width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;resize:none;color:var(--txt);font-family:inherit;font-size:14px;line-height:1.3;padding:0;-webkit-user-select:text;user-select:text}
.pf-f input.pf-inp{display:block;width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;color:var(--txt);font-family:inherit;font-size:18px;font-weight:700;padding:0;-webkit-user-select:text;user-select:text}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pf-stats div{background:rgba(255,255,255,.04);border:1px solid #ffffff14;text-align:center;padding:5px 2px}
.pf-stats b{display:block;font-size:17px;line-height:1}.pf-stats small{font-size:9px;color:var(--mut);letter-spacing:1px}
.pf-bt{display:flex;gap:7px;margin-top:auto}.pf-bt .btn{flex:1}
.pf-r{position:relative;min-height:0;border-left:1px solid #ffffff14;background:radial-gradient(ellipse at 50% 72%,#313c47 0,#161b21 55%,#0b0d10 100%)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script>
(()=>{'use strict';
/* =====================================================================
   TACTICAL STRIKE 2 — jogo tático 3D mobile (arquivo único)
   Módulos: Store · Settings · Snd · Tex · World · Nav · Weapons · Viewmodel
            Bot · Player · Controls (touch) · HUD (editor) · Shop · UI · Game
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------------- Store (localStorage seguro) ---------------- */
const Store={
  get(k,d){try{const v=localStorage.getItem('ts2_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ts2_'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------------- Configurações ---------------- */
const DEF={name:'Player',sens:1.0,fov:80,quality:'alta',scale:100,shadows:true,fps:true,vol:80,sfx:90,
  crouchToggle:true,xColor:'#7CFC00',xSize:7,xGap:4,xThick:2,xDot:false,xShape:'classic',xDyn:true,hudOpacity:60,hudSize:100};
const S=Object.assign({},DEF,Store.get('settings',{}));
const saveS=()=>Store.set('settings',S);

/* ---------------- Áudio procedural ---------------- */
const Snd={ctx:null,nb:{},
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  shot(vol=1,heavy=false){const c=this.ctx;if(!c||vol<.02)return;
    const key=heavy?'h':'l';
    if(!this.nb[key]){const n=c.sampleRate*(heavy?.3:.15),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,heavy?2:3);this.nb[key]=b}
    const s=c.createBufferSource();s.buffer=this.nb[key];
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=heavy?700:2000;
    const g=c.createGain();g.gain.value=vol*S.vol/100*S.sfx/100*.7;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start()},
  tone(fr=700,dur=.06,vol=.15){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();
    o.frequency.value=fr;o.type='square';g.gain.value=vol*S.vol/100*S.sfx/100;
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}
};

/* ---------------- Texturas procedurais ---------------- */
const Tex={
  mk(w,h,fn){let c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
    if(Tex.lo&&w>=256&&h>=256){const k=document.createElement('canvas');k.width=w>>1;k.height=h>>1;k.getContext('2d').drawImage(c,0,0,k.width,k.height);c=k}   // qualidade Baixa: chão/paredes com metade da resolução
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;
    return applyAntiScratch(t)},
  /* reboco bege com manchas, rachaduras e retalhos de tijolo aparente */
  plaster(){return this.mk(256,256,(g,w,h)=>{
    g.fillStyle='#d3ba8c';g.fillRect(0,0,w,h);
    for(let i=0;i<700;i++){g.fillStyle=`rgba(${110+rnd(0,70)|0},${85+rnd(0,50)|0},45,${rnd(.06,.18)})`;
      g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(2,16),0,7);g.fill()}
    for(let p=0;p<4;p++){const cx=rnd(30,w-30),cy=rnd(30,h-30),R=rnd(18,30);
      g.save();g.beginPath();
      for(let a=0;a<12;a++){const an=a/12*6.283,r=R*rnd(.6,1.15);g[a?'lineTo':'moveTo'](cx+Math.cos(an)*r*1.2,cy+Math.sin(an)*r*.9)}
      g.closePath();g.clip();g.fillStyle='#8a5a34';g.fillRect(cx-40,cy-40,80,80);
      g.strokeStyle='#5a3a20';g.lineWidth=1.5;
      for(let y=cy-40;y<cy+40;y+=9){g.beginPath();g.moveTo(cx-40,y);g.lineTo(cx+40,y);g.stroke();
        for(let x=cx-40+((y/9|0)%2)*9;x<cx+40;x+=18){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+9);g.stroke()}}
      g.restore()}
    g.strokeStyle='rgba(70,45,20,.35)';g.lineWidth=1;
    for(let i=0;i<6;i++){let x=rnd(0,w),y=rnd(0,h);g.beginPath();g.moveTo(x,y);
      for(let k=0;k<6;k++){x+=rnd(-10,10);y+=rnd(4,14);g.lineTo(x,y)}g.stroke()}})},
  sand(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#cdb27d';g.fillRect(0,0,w,h);
    for(let i=0;i<46;i++){g.fillStyle=Math.random()<.5?`rgba(150,112,62,${rnd(.10,.30)})`:`rgba(236,214,160,${rnd(.10,.30)})`;g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(10,40),rnd(6,22),rnd(0,3),0,7);g.fill()}
    for(let i=0;i<8;i++){g.strokeStyle='rgba(120,90,50,.16)';g.lineWidth=1.2;g.beginPath();const y=rnd(0,h);g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x/22+i)*3);g.stroke()}
    for(let i=0;i<2500;i++){g.fillStyle=`rgba(${120+rnd(0,90)|0},${95+rnd(0,70)|0},${50+rnd(0,40)|0},${rnd(.05,.2)})`;
      g.fillRect(rnd(0,w),rnd(0,h),rnd(1,4),rnd(1,4))}})},
  tiles(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#cdb98f';g.fillRect(0,0,w,h);
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){const v=rnd(-22,18);g.fillStyle=`rgb(${205+v|0},${185+v|0},${143+v|0})`;g.fillRect(x*64+2,y*64+2,60,60)}
    g.strokeStyle='#8c7550';g.lineWidth=3;for(let i=0;i<=256;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}
    for(let i=0;i<500;i++){g.fillStyle=`rgba(90,70,40,${rnd(0,.08)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(2,10),rnd(2,10))}})},
  crate(){return this.mk(128,128,(g,w,h)=>{g.fillStyle='#a2763d';g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=16){g.fillStyle=`rgba(0,0,0,${rnd(.04,.14)})`;g.fillRect(0,y,w,16);g.fillStyle='#4a3014';g.fillRect(0,y,w,2)}
    g.strokeStyle='#4a3014';g.lineWidth=8;g.strokeRect(4,4,w-8,h-8);g.beginPath();g.moveTo(8,8);g.lineTo(w-8,h-8);g.stroke();
    g.strokeStyle='#00000030';g.lineWidth=1;for(let i=0;i<30;i++){g.beginPath();const y=rnd(0,h);g.moveTo(0,y);g.lineTo(w,y+rnd(-2,2));g.stroke()}})},
  concrete(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#9b9b96';g.fillRect(0,0,w,h);for(let i=0;i<1800;i++){const v=110+rnd(0,70)|0;g.fillStyle=`rgba(${v},${v},${v-4},${rnd(.05,.25)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(1,5),rnd(1,5))}
    g.strokeStyle='rgba(50,50,50,.45)';g.lineWidth=2;for(let i=0;i<=256;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}
    for(let i=0;i<8;i++){g.fillStyle='rgba(40,35,30,.12)';g.fillRect(rnd(0,w),0,rnd(2,6),h)}})},
  dirt(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#5d4c2f';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${50+rnd(0,60)|0},${60+rnd(0,70)|0},${25+rnd(0,25)|0},${rnd(.1,.4)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(1,4),rnd(1,4))}
    for(let i=0;i<20;i++){g.fillStyle='rgba(60,95,45,.3)';g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(5,16),0,7);g.fill()}})},
  brick(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#7d3f30';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=16)for(let x=((y/16)%2)*16-16;x<w+32;x+=32){const v=rnd(-14,14);g.fillStyle=`rgb(${140+v|0},${72+v|0},${54+v|0})`;g.fillRect(x+1,y+1,30,14)}
    g.strokeStyle='#4a2a22';g.lineWidth=1.5;for(let y=0;y<=h;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}})},
  grass(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#6f8a4a';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle=`rgba(${60+rnd(0,50)|0},${90+rnd(0,60)|0},${40+rnd(0,30)|0},${rnd(.1,.4)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(2,5))}
    for(let i=0;i<14;i++){g.fillStyle='rgba(120,95,60,.25)';g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(6,20),0,7);g.fill()}})},
  stone(){return this.mk(256,256,(g,w,h)=>{g.fillStyle='#8d8b84';g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=32)for(let x=((y/32)%2)*24-24;x<w+48;x+=48){const v=rnd(-14,14);g.fillStyle=`rgb(${125+v|0},${122+v|0},${114+v|0})`;g.fillRect(x+2,y+2,44,28)}
    g.strokeStyle='#5c5a54';g.lineWidth=2;for(let y=0;y<=h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
    for(let i=0;i<500;i++){g.fillStyle=`rgba(40,35,25,${rnd(0,.08)})`;g.fillRect(rnd(0,w),rnd(0,h),rnd(2,8),rnd(2,8))}})},
  /* gera bumpMap e roughnessMap (cinza, linear) a partir da textura difusa e aplica no material */
  pbr(m,t,bs,rlo,rhi){if(Tex.lo){m.bumpMap=null;m.roughnessMap=null;return m}   // Baixa: sem bumpMap e sem roughnessMap (nem gera os canvases)
    try{const im=t.image,w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0);
    const a=g.getImageData(0,0,w,h).data,mkc=()=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k},bc=mkc(),rc=mkc(),bg=bc.getContext('2d'),rg=rc.getContext('2d'),bd=bg.createImageData(w,h),rd=rg.createImageData(w,h);
    for(let i=0;i<a.length;i+=4){const l=(a[i]*.3+a[i+1]*.59+a[i+2]*.11)/255,v=clamp(((l-.5)*2+.5),0,1)*255,r=(rlo+(1-l)*(rhi-rlo))*255;
      bd.data[i]=bd.data[i+1]=bd.data[i+2]=v;bd.data[i+3]=255;rd.data[i]=rd.data[i+1]=rd.data[i+2]=r;rd.data[i+3]=255}
    bg.putImageData(bd,0,0);rg.putImageData(rd,0,0);
    const T=k=>{const x=new THREE.CanvasTexture(k);x.wrapS=x.wrapT=THREE.RepeatWrapping;x.anisotropy=Tex.aniso||4;return x};
    const bt=T(bc);m.userData.bm0=bt;m.bumpMap=Tex.bump===false?null:bt;m.bumpScale=bs;m.roughnessMap=T(rc);m.roughness=1;m.needsUpdate=true}catch(e){}return m},
  label(txt){return this.mk(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='rgba(220,40,30,.45)';g.fillRect(0,0,w,h);
    g.fillStyle='rgba(255,255,255,.8)';g.font='bold 90px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,64,70)})}
};

/* ---------------- Mundo 3D ---------------- */
const World={scene:null,camera:null,renderer:null,sun:null,colliders:[],walls:[],smokes:[],spawns:{T:[],CT:[]},clock:new THREE.Clock()};
/* ================= OTIMIZAÇÕES DE PERFORMANCE (mobile) =================
   mergeMap     : junta paredes/caixas/janelas/árvores em poucas malhas (1 draw call por material)
   mergeBotGuns : junta as peças da arma dos bots em 1 malha por material
   dynShadowMs  : 0 = sombra estática (só atualiza em newRound / troca de qualidade). >0 = reatualiza a cada N ms

/* Colisão círculo × AABB (só XZ). y permite subir em caixas baixas. */
function resolveCircle(p,r,y){
  for(const b of World.colliders){if(y>=b.h-.05)continue;
    const cx=clamp(p.x,b.minX,b.maxX),cz=clamp(p.z,b.minZ,b.maxZ),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r}
      else{const l=p.x-b.minX,rt=b.maxX-p.x,t=p.z-b.minZ,bt=b.maxZ-p.z,m=Math.min(l,rt,t,bt);
        if(m===l)p.x=b.minX-r;else if(m===rt)p.x=b.maxX+r;else if(m===t)p.z=b.minZ-r;else p.z=b.maxZ+r}}}
}
function groundAt(p,y){let g=0;for(const b of World.colliders){if(b.h>1.3)continue;
  if(p.x>b.minX&&p.x<b.maxX&&p.z>b.minZ&&p.z<b.maxZ&&y>=b.h-.1)g=Math.max(g,b.h)}return g}

const Nav={cs:1.5,x0:-30,z0:-40,nx:40,nz:54,blk:null,
  build(){this.blk=new Uint8Array(this.nx*this.nz);
    for(let i=0;i<this.nx;i++)for(let j=0;j<this.nz;j++){const x=this.x0+(i+.5)*this.cs,z=this.z0+(j+.5)*this.cs;let b=0;
      for(const c of World.colliders){const dx=x-clamp(x,c.minX,c.maxX),dz=z-clamp(z,c.minZ,c.maxZ);if(dx*dx+dz*dz<.55*.55){b=1;break}}
      this.blk[i*this.nz+j]=b}},
  cell(x,z){return[clamp(Math.floor((x-this.x0)/this.cs),0,this.nx-1),clamp(Math.floor((z-this.z0)/this.cs),0,this.nz-1)]},
  free(i,j){return i>=0&&j>=0&&i<this.nx&&j<this.nz&&!this.blk[i*this.nz+j]},
  nearestFree(i,j){if(this.free(i,j))return[i,j];for(let r=1;r<6;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++)if(this.free(i+a,j+b))return[i+a,j+b];return[i,j]},
  randomPoint(zMin=-38,zMax=38){for(let k=0;k<40;k++){const i=(Math.random()*this.nx)|0,j=this.cell(0,rnd(zMin,zMax))[1];if(this.free(i,j))return V3(this.x0+(i+.5)*this.cs,0,this.z0+(j+.5)*this.cs)}return V3(0,0,0)},
  find(sx,sz,tx,tz){
    let[si,sj]=this.nearestFree(...this.cell(sx,sz)),[ti,tj]=this.nearestFree(...this.cell(tx,tz));
    const N=this.nx*this.nz,g=new Float32Array(N).fill(1e9),par=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
    const id=(i,j)=>i*this.nz+j,h=(i,j)=>Math.hypot(i-ti,j-tj);
    const open=[[h(si,sj),si,sj]];g[id(si,sj)]=0;let it=0;
    const push=n=>{open.push(n);let k=open.length-1;while(k>0){const p=(k-1)>>1;if(open[p][0]<=open[k][0])break;[open[p],open[k]]=[open[k],open[p]];k=p}};
    const pop=()=>{const t=open[0],l=open.pop();if(open.length){open[0]=l;let k=0;for(;;){let a=2*k+1,b=a+1,m=k;if(a<open.length&&open[a][0]<open[m][0])m=a;if(b<open.length&&open[b][0]<open[m][0])m=b;if(m===k)break;[open[m],open[k]]=[open[k],open[m]];k=m}}return t};
    while(open.length&&it++<5000){const[,ci,cj]=pop(),cid=id(ci,cj);if(closed[cid])continue;closed[cid]=1;
      if(ci===ti&&cj===tj)break;
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const ni=ci+a,nj=cj+b;if(!this.free(ni,nj))continue;
        if(a&&b&&(!this.free(ci+a,cj)||!this.free(ci,cj+b)))continue; // sem cortar quina
        const nid=id(ni,nj),ng=g[cid]+(a&&b?1.414:1);if(ng<g[nid]){g[nid]=ng;par[nid]=cid;push([ng+h(ni,nj),ni,nj])}}}
    const path=[];let c=id(ti,tj);if(par[c]<0&&!(ti===si&&tj===sj))return path;
    while(c>=0){path.push(V3(this.x0+(((c/this.nz)|0)+.5)*this.cs,0,this.z0+((c%this.nz)+.5)*this.cs));c=par[c]}
    return path.reverse().slice(1)}
};

/* 1) FILTRO ANTI-RISCOS GLOBAL ---------------------------------------- */
function applyAntiScratch(t){
  if(t._as) return t;              // já filtrada: não reenvia à GPU
  t._as = 1;
  t.generateMipmaps = true;
  t.minFilter  = THREE.LinearMipmapLinearFilter;
  t.magFilter  = THREE.LinearFilter;
  t.anisotropy = 16;               // o three.js limita ao máximo da GPU automaticamente
  t.needsUpdate = true;
  return t;
}

/* 2) OURO MIDAS ---------------------------------------------------------- */
const GOLD_HEX = 0xD4AF37;
const isGoldSkin = sk => !!sk && (SKINPAT[sk.id]==='gold' || /^g_.*gold/.test(sk.id||''));

function goldMaterial(env, bump){
  return new THREE.MeshStandardMaterial({
    color: GOLD_HEX,
    metalness: 1.0,
    roughness: 0.12,
    envMap: env || null,           // metal 100% precisa de reflexo, senão fica preto
    envMapIntensity: 1.6,
    bumpMap: bump || null,         // gravações finas da textura original
    bumpScale: bump ? 0.15 : 0
  });
}

/* 3) PADRÃO PARA TODAS AS OUTRAS SKINS ---------------------------------- */
function skinMaterial(sk, env){
  const map = applyAntiScratch(skinTex(sk));
  if(isGoldSkin(sk)) return goldMaterial(env, map);
  return new THREE.MeshPhysicalMaterial({
    map,
    roughness: 0.25,               // faixa 0.2–0.3
    metalness: 0.5,                // faixa 0.4–0.6
    clearcoat: 0.35,               // verniz polido (reflexo realista ao sol)
    clearcoatRoughness: 0.1,
    envMap: env || null,
    envMapIntensity: 1.1
  });
}

// Mapa de relevo procedural (branco = alto, preto = sulco)
function nadeBumpTex(kind){
  const key = '_nb_' + kind;
  if(nadeBumpTex[key]) return nadeBumpTex[key];
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#c8c8c8'; g.fillRect(0,0,512,512);
  if(kind === 'frag'){                         // gomos da "casca" de fragmentação
    const nx = 12, ny = 8, sx = 512/nx, sy = 512/ny;
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const gr = g.createRadialGradient(i*sx+sx/2, j*sy+sy/2, 2, i*sx+sx/2, j*sy+sy/2, sx*.62);
      gr.addColorStop(0,'#ffffff'); gr.addColorStop(.7,'#d8d8d8'); gr.addColorStop(1,'#202020');

    for(let y=0;y<512;y+=64){ g.fillStyle='#101010'; g.fillRect(0,y,512,5); g.fillStyle='#ffffff'; g.fillRect(0,y+5,512,3); }

// Material: verde-oliva tático / cinza-escuro, ferro fundido (roughness .4, metalness .5)
function nadeMaterial(skin, kind, env){
  if(isGoldSkin(skin)) return goldMaterial(env, nadeBumpTex(kind));
  const base = new THREE.Color(kind==='frag' ? 0x4b5320 : kind==='flash' ? 0x3a3f44 : 0x55604a);
  const isDef = !skin || skin.n === 'Default';
  const col = isDef ? base : new THREE.Color(parseInt(skin.c1.slice(1),16)).lerp(base,.45); // skin com tom militarizado
  const bm = nadeBumpTex(kind).clone(); bm.needsUpdate = true; applyAntiScratch(bm);
  return new THREE.MeshStandardMaterial({
    color: col, roughness: 0.4, metalness: 0.5,
    bumpMap: bm, bumpScale: kind==='frag' ? 2.2 : 1.2,
    envMap: env || null, envMapIntensity: 0.8
  });
}

// Geometria segmentada (gomos em losango) para a granada de fragmentação
function fragBodyGeometry(r){
  const NX = 12, NY = 8, gm = new THREE.SphereGeometry(r, 72, 48), p = gm.attributes.position, v = new THREE.Vector3();
  const sm = (a,b,x)=>{ x = Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); };
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const len = v.length(), lat = Math.asin(v.y/len), lon = Math.atan2(v.z,v.x);
    const sx = sm(0,.22,Math.abs(Math.sin(lon*NX/2)));            // sulcos verticais
    const sy = sm(0,.22,Math.abs(Math.sin(lat*NY)));              // sulcos horizontais
    const pole = Math.pow(Math.cos(lat),.5);                      // some nos polos
    const k = 1 - .07*(1 - Math.min(sx,sy))*pole;
    v.multiplyScalar(k); p.setXYZ(i,v.x,v.y,v.z);
  }
  gm.computeVertexNormals();
  // costura do UV: une normais de vértices coincidentes (evita linha visível)
  const n = gm.attributes.normal, map = new Map();
  for(let i=0;i<p.count;i++){ const k = p.getX(i).toFixed(4)+','+p.getY(i).toFixed(4)+','+p.getZ(i).toFixed(4); (map.get(k)||map.set(k,[]).get(k)).push(i); }
  map.forEach(ix=>{ if(ix.length<2) return; v.set(0,0,0); ix.forEach(i=>v.add(new THREE.Vector3().fromBufferAttribute(n,i))); v.normalize(); ix.forEach(i=>n.setXYZ(i,v.x,v.y,v.z)); });
  return gm;
}

// Constrói a granada completa (loja/inspeção E gameplay). `skin` = item de GSKINS.
function buildNade(skin, env){
  const t = skin.g, grp = new THREE.Group(), E = env || (typeof Env!=='undefined' ? Env.get() : null);
  const body = nadeMaterial(skin, t, E);
  const gold = isGoldSkin(skin);
  const met  = new THREE.MeshStandardMaterial({color: gold?GOLD_HEX:0x9aa0a6, roughness: gold?.12:.35, metalness: gold?1:.9, envMap:E, envMapIntensity:1.2});
  const acc  = new THREE.MeshStandardMaterial({color:0x2a2d2a, roughness:.4, metalness:.5, envMap:E});
  const add = (geo,m,x,y,z,rx=0,rz=0)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;grp.add(o);return o};

  if(t==='frag'){
    add(fragBodyGeometry(.14),body,0,0,0).scale.y = 1.18;
    add(new THREE.TorusGeometry(.141,.008,8,32),acc,0,0,0,Math.PI/2);
    add(new THREE.CylinderGeometry(.045,.05,.05,14),met,0,.19,0);                       // tampa da espoleta
    add(new THREE.BoxGeometry(.02,.17,.045),met,.05,.12,0,0,-.12);                      // alavanca
    add(new THREE.TorusGeometry(.03,.006,8,16),met,.075,.2,0,Math.PI/2);                // contrapino
  }else if(t==='flash'){
    add(new THREE.CylinderGeometry(.07,.07,.26,32,8),body,0,0,0);
    add(new THREE.CylinderGeometry(.0735,.0735,.045,32),acc,0,.02,0);
    add(new THREE.CylinderGeometry(.072,.072,.03,32),met,0,.145,0);
    add(new THREE.CylinderGeometry(.072,.072,.03,32),met,0,-.145,0);
    add(new THREE.CylinderGeometry(.03,.03,.04,12),met,0,.18,0);
  }else{ // smoke
    add(new THREE.CylinderGeometry(.075,.075,.24,32,8),body,0,0,0);
    add(new THREE.CylinderGeometry(.0775,.0775,.05,32),acc,0,-.02,0);
    add(new THREE.CylinderGeometry(.076,.076,.03,32),met,0,.135,0);
    add(new THREE.CylinderGeometry(.025,.025,.06,12),met,0,.18,0);
    for(let i=0;i<6;i++){const a=i*1.047;add(new THREE.CylinderGeometry(.008,.008,.03,6),acc,Math.cos(a)*.05,.152,Math.sin(a)*.05)}
  }
  return grp;
}

/* ---------------- Controles touch ---------------- */
const Controls={mx:0,my:0,lookX:0,lookY:0,actHeld:false,fireHeld:false,fireQ:false,crouchHeld:false,
  init(){
    const zL=$('#zoneL'),zR=$('#zoneR'),stick=$('#stick'),knob=$('#knob'),R=55;
    let L=null,Rr=null; // toques ativos (id + dados)
    const find=(e,id)=>[...e.changedTouches].find(t=>t.identifier===id);

    /* ===== Joystick analógico virtual DINÂMICO (lado esquerdo) =====
       O centro aparece onde o polegar encosta; o desvio vira vetor [-1,1]. */
    zL.addEventListener('touchstart',e=>{e.preventDefault();Snd.init();if(L)return;const t=e.changedTouches[0];
      L={id:t.identifier,x:t.clientX,y:t.clientY};
      stick.style.display='block';stick.style.left=L.x+'px';stick.style.top=L.y+'px';knob.style.transform='translate(0,0)'},{passive:false});
    zL.addEventListener('touchmove',e=>{e.preventDefault();if(!L)return;const t=find(e,L.id);if(!t)return;
      let dx=t.clientX-L.x,dy=t.clientY-L.y;const d=Math.hypot(dx,dy);
      if(d>R){dx*=R/d;dy*=R/d}                       // limita ao raio da base
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      const dz=.12,m=Math.min(1,d/R);                // zona morta
      if(m<dz){this.mx=this.my=0}else{this.mx=dx/R;this.my=dy/R}},{passive:false});
    const endL=e=>{if(!L||!find(e,L.id))return;L=null;this.mx=this.my=0;stick.style.display='none'};
    zL.addEventListener('touchend',endL);zL.addEventListener('touchcancel',endL);

    /* ===== Zona de Mira e Tiro (lado direito) =====
       • arrastar  -> gira a câmera (acumulado em lookX/lookY e suavizado no Player.update)
       • tap rápido -> 1 disparo
       • segurar parado (>150 ms, sem grande arrasto) -> fogo contínuo/semiautomático */
    const DRAG=14,HOLD=150,TAP=230;
    zR.addEventListener('touchstart',e=>{e.preventDefault();Snd.init();if(Rr)return;const t=e.changedTouches[0];
      Rr={id:t.identifier,sx:t.clientX,sy:t.clientY,lx:t.clientX,ly:t.clientY,t0:performance.now(),moved:false,fired:false};
      Rr.timer=setTimeout(()=>{if(Rr&&!Rr.moved){Rr.fired=true;this.fireHeld=true;this.fireQ=true}},HOLD);
      if(!Player.alive)Game.cycleSpec()},{passive:false});
    zR.addEventListener('touchmove',e=>{e.preventDefault();if(!Rr)return;const t=find(e,Rr.id);if(!t)return;
      this.lookX+=t.clientX-Rr.lx;this.lookY+=t.clientY-Rr.ly;Rr.lx=t.clientX;Rr.ly=t.clientY;
      if(!Rr.moved&&Math.hypot(t.clientX-Rr.sx,t.clientY-Rr.sy)>DRAG){Rr.moved=true;clearTimeout(Rr.timer)}},{passive:false});
    const endR=e=>{if(!Rr||!find(e,Rr.id))return;clearTimeout(Rr.timer);
      if(!Rr.moved&&!Rr.fired&&performance.now()-Rr.t0<TAP)this.fireQ=true;   // tap rápido
      this.fireHeld=false;Rr=null};
    zR.addEventListener('touchend',endR);zR.addEventListener('touchcancel',endR);
    HUD.bindButtons();
  }
};

  defaults:{fire:[88,66],jump:[95,38],crouch:[95,80],reload:[78,40],buy:[40,12],swap:[68,86],drop:[52,86],pick:[50,62],scope:[66,62],act:[58,46],frag:[62,22],flash:[52,22],smoke:[72,22]}, // % da tela
  pos:Store.get('hudpos',{}),
  apply(){$$('.hbtn').forEach(b=>{const p=this.pos[b.dataset.id]||this.defaults[b.dataset.id];b.style.left=p[0]+'%';b.style.top=p[1]+'%'});
    const r=document.documentElement.style;r.setProperty('--bs',S.hudSize/100);r.setProperty('--bo',S.hudOpacity/100*.9);r.setProperty('--bo2',.4+S.hudOpacity/100*.6)},
  bindButtons(){
    const act={
      fire:{down(){Controls.fireHeld=true;Controls.fireQ=true},up(){Controls.fireHeld=false}},
      jump:{down(){Player.jumpQ=true}},
      crouch:{down(b){if(S.crouchToggle){Controls.crouchHeld=!Controls.crouchHeld;b.classList.toggle('act',Controls.crouchHeld)}else Controls.crouchHeld=true},
        up(b){if(!S.crouchToggle){Controls.crouchHeld=false}}},
      reload:{down(){Player.reload()}},buy:{down(){Shop.toggle()}},swap:{down(){Player.swap()}},drop:{down(){Player.dropItem(Player.cur)}},pick:{down(){const d=Drops.cur;if(d&&Player.alive)Drops.take(d,Player)}},
      scope:{down(){Player.setScope(!Player.scoped)}},act:{down(){Controls.actHeld=true},up(){Controls.actHeld=false}},frag:{down(){Player.throwNade('frag')}},flash:{down(){Player.throwNade('flash')}},smoke:{down(){Player.throwNade('smoke')}}};
    $$('.hbtn').forEach(b=>{const id=b.dataset.id;let drag=null;
      b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();Snd.init();const t=e.changedTouches[0];
        if(this.editing){ /* modo editor: começa a arrastar */
          const r=b.getBoundingClientRect();drag={id:t.identifier,ox:t.clientX-(r.left+r.width/2),oy:t.clientY-(r.top+r.height/2)};return}
        act[id].down&&act[id].down(b)},{passive:false});
      b.addEventListener('touchmove',e=>{e.preventDefault();if(!this.editing||!drag)return;
        const t=[...e.changedTouches].find(x=>x.identifier===drag.id);if(!t)return;
        // converte px -> % e limita à tela
        const x=clamp((t.clientX-drag.ox)/innerWidth*100,4,96),y=clamp((t.clientY-drag.oy)/innerHeight*100,6,94);
        b.style.left=x+'%';b.style.top=y+'%';this.pos[id]=[+x.toFixed(2),+y.toFixed(2)]},{passive:false});
      const end=e=>{e.preventDefault();if(this.editing){drag=null;return} // só grava ao tocar em SALVAR
        act[id].up&&act[id].up(b)};
      b.addEventListener('touchend',end,{passive:false});b.addEventListener('touchcancel',end,{passive:false})});
    $('#edDone').onclick=()=>this.stopEdit(true);
    $('#edCancel').onclick=()=>this.stopEdit(false);
    $('#edReset').onclick=()=>{this.pos={};S.hudSize=DEF.hudSize;S.hudOpacity=DEF.hudOpacity;this.syncEd();this.apply()}; // restaura (só vale após SALVAR)
    $('#edSz').oninput=e=>{S.hudSize=+e.target.value;this.syncEd();this.apply()};
    $('#edOp').oninput=e=>{S.hudOpacity=+e.target.value;this.syncEd();this.apply()};
    $('#pauseBtn').onclick=()=>Game.pause(true);
  },
  syncEd(){$('#edSz').value=S.hudSize;$('#edOp').value=S.hudOpacity;$('#edSzV').textContent=S.hudSize+'%';$('#edOpV').textContent=S.hudOpacity+'%'},
  startEdit(fromGame){this.bak={pos:JSON.stringify(this.pos),sz:S.hudSize,op:S.hudOpacity};this.syncEd();this.editing=true;$$('.hbtn').forEach(b=>b.style.display='');this.fromGame=fromGame;document.body.classList.add('editing');
    $('#hud').classList.remove('hidden');if(!fromGame)$('#hud').classList.add('preview');$('#menu').classList.add('hidden');$('#pause').classList.add('hidden');this.apply()},
  stopEdit(save){this.editing=false;document.body.classList.remove('editing');
    if(save){Store.set('hudpos',this.pos);saveS()}else if(this.bak){this.pos=JSON.parse(this.bak.pos);S.hudSize=this.bak.sz;S.hudOpacity=this.bak.op}this.apply();
    if(this.fromGame){$('#pause').classList.remove('hidden')}else{$('#hud').classList.add('hidden');$('#hud').classList.remove('preview');$('#menu').classList.remove('hidden')}}
};

/* Miniaturas assíncronas: a tela abre na hora com um espaço em branco e cada <img> é trocado quando a miniatura fica pronta.
   Gera no máx. ~9 ms por quadro (nada de travar) e pré-aquece o resto enquanto você está no menu. */
(()=>{
  const PH='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',fg=[],bg=[],done={};let run=false;Thumb.fg=fg;Thumb.bg=bg;
  const gen=j=>{if(done[j.k])return;try{done[j.k]=Thumb['_'+j.fn](...j.a)}catch(e){done[j.k]=PH;return}
    document.querySelectorAll('img[src$="#'+j.k+'"]').forEach(im=>{im.src=done[j.k]})};
  const step=()=>{const t0=performance.now();let n=0;
    while(n===0||performance.now()-t0<9){let j=fg.shift();if(!j&&Game.mode==='menu')j=bg.shift();if(!j)break;gen(j);n++}
    if(fg.length||(bg.length&&Game.mode==='menu'))requestAnimationFrame(step);else{run=false;if(bg.length)setTimeout(kick,1500)}};
  const kick=()=>{if(!run){run=true;requestAnimationFrame(step)}};
  ['weapon','icon','nadeSkin','agent'].forEach(fn=>{Thumb['_'+fn]=Thumb[fn];
    Thumb[fn]=function(...a){const k=fn+'_'+a.join('_');if(done[k])return done[k];if(!fg.some(j=>j.k===k)){fg.unshift({k,fn,a});kick()}return PH+'#'+k}});
  Thumb.prewarm=()=>{const add=(fn,...a)=>bg.push({k:fn+'_'+a.join('_'),fn,a});
    Object.keys(W).filter(k=>k!=='knife'&&k!=='c4').forEach(k=>add('icon',k));
    SKINS.forEach(sk=>add('weapon',sk.id));GSKINS.forEach(g=>add('nadeSkin',g.id));
    ['T','CT'].forEach(t=>AGENTS[t].forEach(a=>add('agent',t,a.id)));kick()};
  setTimeout(()=>Thumb.prewarm(),6000);
})();
const Shop={open:false,
  items:{
    1:[{id:'vest',name:'Colete',price:450},{id:'vesthelm',name:'Colete + Capacete',price:1000},{id:'kit',name:'Kit desarme',price:400,ct:1}],
    5:[{id:'flash',name:'Flashbang',price:200},{id:'smoke',name:'Granada de Fumaça',price:300},{id:'frag',name:'Granada HE',price:300}],
    2:{T:['glock','deagle'],CT:['usp','deagle']},3:['mac10','p90','nova'],4:{T:['galil','ak47','ssg08','awp'],CT:['m4a1s','m4a4','ssg08','awp']}},
  canBuy(){return Player.alive&&(Game.phase==='buy'||Game.opts.eco==='treino')},
  toggle(){if(this.open)return this.close();
    if(!Player.alive)return;if(!this.canBuy()){Game.hint('Tempo de compra encerrado');return}this.open=true;this.render();$('#shop').classList.remove('hidden')},
  close(){this.open=false;$('#shop').classList.add('hidden')},
  buy(id){if(!this.canBuy())return;const it=this.items[1].concat(this.items[5]).find(x=>x.id===id);
    if(it){if(Player.money<it.price||(Player.nades[id]!==undefined&&Player.nades[id]>=(id==='flash'?2:1))||(id==='kit'&&Player.kit))return Snd.tone(150,.1);
      Player.money-=it.price;if(Player.nades[id]!==undefined)Player.nades[id]++;else if(id==='kit')Player.kit=true;else{Player.armor=100;Player.helmet=id==='vesthelm'}}
    else{const w=W[id];if(Player.money<w.price)return Snd.tone(150,.1);Player.money-=w.price;Player.give(id)}
    Snd.tone(900,.05);HUDui.dirty=true;this.render()},
  render(){const col=(t,l)=>`<div><h4>${t}</h4>${l}</div>`;
    const wi=(id,i)=>{const w=W[id],own=Player.loadout.primary===id||Player.loadout.pistol===id,sk=skinOf(id);
      return`<button class="si ${own?'eqp':''} ${Player.money<w.price?'no':''}" data-b="${id}"><img src="${Thumb.icon(id)}" alt=""><b>${i+1}. ${w.name}</b><span>${own?'EQUIPADO':'$'+w.price}</span><em>$${w.price}</em></button>`};
    const eq=(x,i)=>{const n=Player.nades[x.id],sf=n!==undefined?` (${n})`:(x.id==='kit'&&Player.kit?' ✔':'');
      return`<button class="si ${Player.money<x.price?'no':''}" data-b="${x.id}">${n!==undefined?`<img class="col" src="${Thumb.nade(x.id)}" alt="">`:`<i>${ICO[x.id]}</i>`}<b>${i+1}. ${x.name}${sf}</b><em>$${x.price}</em></button>`};
    $('#shop').innerHTML=`<div id="shopBox"><div id="shopHead"><div><span class="m">$${Player.money}</span>${Game.phase==='buy'?'Tempo de compra restante '+Math.ceil(Game.timer)+'s':'Modo treino'}</div>
      <button class="btn" id="shClose">FECHAR</button></div><div id="shopCols">
      ${col('1 · Equipamentos',this.items[1].filter(x=>!x.ct||Player.team==='CT').map(eq).join(''))}
      ${col('2 · Pistolas',this.items[2][Player.team].map(wi).join(''))}${col('3 · Intermediárias',this.items[3].map(wi).join(''))}
      ${col('4 · Rifles',this.items[4][Player.team].map(wi).join(''))}
      ${col('5 · Granadas',this.items[5].map(eq).join(''))}
      </div></div>`;
    $('#shClose').onclick=()=>this.close();
    $$('#shop [data-b]').forEach(b=>b.onclick=()=>this.buy(b.dataset.b));
    $('#shop').onclick=e=>{if(e.target.id==='shop')this.close()}}
};

const HUDui={dirty:true,rt:0,cache:{},
  set(id,v){if(this.cache[id]!==v){this.cache[id]=v;$(id).textContent=v}},
  crosshair(){const c=$('#cross');c.innerHTML='';c.style.setProperty('--xc',S.xColor);
    const sh=S.xShape||'classic';
    if(sh==='classic')['t','b','l','r'].forEach(s=>{const i=document.createElement('i');i.dataset.s=s;c.appendChild(i)});
    else if(sh==='circle'||sh==='square'){const i=document.createElement('i');i.dataset.s='ring';i.style.cssText='background:transparent;box-sizing:border-box;border:'+S.xThick+'px solid '+S.xColor+';border-radius:'+(sh==='circle'?'50%':'1px');c.appendChild(i)}
    if(S.xDot||sh==='dot'){const z=sh==='dot'?Math.max(3,Math.round(S.xSize/2)):2,d=document.createElement('i');d.style.cssText='left:'+(-z/2)+'px;top:'+(-z/2)+'px;width:'+z+'px;height:'+z+'px;border-radius:'+(sh==='dot'?'50%':'0');c.appendChild(d)}this.cross(0)},
  cross(extra){const sz=S.xSize*1.6,g=S.xGap+extra,t=S.xThick;
    $$('#cross i[data-s]').forEach(i=>{const s=i.dataset.s,st=i.style;
      if(s==='ring'){const d=2*(g+sz*.45);st.width=st.height=d+'px';st.left=st.top=-d/2+'px';return}
      if(s==='t'||s==='b'){st.width=t+'px';st.height=sz+'px';st.left=-t/2+'px';st[s==='t'?'top':'top']=(s==='t'?-g-sz:g)+'px'}
      else{st.height=t+'px';st.width=sz+'px';st.top=-t/2+'px';st.left=(s==='l'?-g-sz:g)+'px'}})},
  update(dt){
    const P=Player;this.rt-=dt;
    if(this.rt<=0){this.rt=.1;
      this.set('#hp',Math.ceil(P.hp));this.set('#ar',Math.ceil(P.armor));
      const w=P.w,a=P.ammo[w.id];const nd=w.kind==='nade',nm=w.melee||w.kind==='bomb'||nd;this.set('#am',nd?P.nades[w.id]:nm?'—':(a?a.mag:0));this.set('#ar2',nm?'':'/ '+(a?a.res:0));
      this.set('#money','$'+P.money);
      const t=Math.max(0,Math.ceil(Game.timer));
      if(Game.phase==='buy'){ $('#tm').innerHTML=`${t}<small>COMPRA</small>`}
      else if(Game.bomb.state==='planted')$('#tm').innerHTML=`${Math.ceil(Game.bomb.t)}<small style="color:#ff5a4a">BOMBA ${Game.bomb.site}</small>`;
      else $('#tm').innerHTML=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}<small>ROUND ${Game.round}</small>`;
      this.set('#sA',Game.score[Player.team]);this.set('#sB',Game.score[Player.team==='T'?'CT':'T']);
      if(Shop.open&&Game.phase==='buy')$('#shopHead .m').nextSibling.textContent='Tempo de compra restante '+t+'s';
      $('#fps').textContent=S.fps?Math.min(60,Math.round(Game.fps))+' FPS':'';
      if(!HUD.editing){const vis=(id,v,t)=>{const b=$('.hbtn[data-id='+id+']');b.style.display=v?'':'none';if(t)b.textContent=t};
        vis('scope',P.alive&&w.kind==='sniper');vis('frag',P.nades.frag>0,'GRANADA '+P.nades.frag);vis('flash',P.nades.flash>0,'FLASH '+P.nades.flash);vis('smoke',P.nades.smoke>0,'FUMAÇA '+P.nades.smoke);const cx=Game.actCtx();vis('act',!!cx,cx==='plant'?'PLANTAR':'DESARMAR')}
      const ra=this.radar;if(ra)this.drawRadar()}
    if(S.xDyn)this.cross((P.moving?5:0)+(P.air?8:0)+P.bloom*160)},
  radar:null,
  drawRadar(){const c=this.radar,g=c.getContext('2d'),R=48,sc=R/38,P=Player,cam=World.camera;
    g.clearRect(0,0,96,96);g.save();g.beginPath();g.arc(48,48,R,0,7);g.clip();
    g.translate(48,48);g.rotate(P.alive?P.yaw:cam.rotation.y);g.scale(sc,sc);g.translate(-cam.position.x,-cam.position.z);
    g.fillStyle='#b99a64';World.colliders.forEach(b=>{if(b.maxX-b.minX<60&&b.maxZ-b.minZ<60)g.fillRect(b.minX,b.minZ,b.maxX-b.minX,b.maxZ-b.minZ)});
    World.sites.forEach(s=>{g.fillStyle='rgba(255,70,50,.22)';g.beginPath();g.arc(s.x,s.z,s.r,0,7);g.fill()});const bm=Game.bomb;if(bm.state==='planted'&&(Math.floor(bm.t*2)%2)){g.fillStyle='#f33';g.beginPath();g.arc(bm.pos.x,bm.pos.z,2.4,0,7);g.fill()}
    for(const b of Game.bots){if(!b.alive)continue;const ally=b.team===Player.team;if(!ally&&b.spotted<=0)continue;
      g.fillStyle=ally?'#5aa0ff':'#e5483b';g.beginPath();g.arc(b.pos.x,b.pos.z,1.8,0,7);g.fill()}
    g.restore();g.fillStyle='#fff';g.beginPath();g.moveTo(48,43);g.lineTo(52,53);g.lineTo(44,53);g.fill()}
};

const Drops={list:[],n:0,cur:null,
  drop(wid,x,z,ammo,net,sk,id){id=id||((Online.pid||'p')+'_'+(++this.n));
    const isN=wid==='frag'||wid==='flash'||wid==='smoke';
    const g=isN?buildNade(gSkin(wid)||{g:wid,id:'',n:'Default',c1:'#4b5320',c2:'#4b5320'}):weaponModel(wid,sk||null,false);g.scale.setScalar(isN?.6:.95);g.position.set(x,isN?.12:(wid==='c4'?.1:.14),z);g.rotation.set(0,Math.random()*6.28,(isN||wid==='c4')?0:Math.PI/2);World.scene.add(g);
    this.list.push({id,w:wid,x,z,a:ammo?{mag:ammo.mag,res:ammo.res}:null,m:g});
    if(net&&!isN&&Online.room)Online.ev({t:'dr',i:id,w:wid,x:+x.toFixed(2),z:+z.toFixed(2),a:ammo?[ammo.mag,ammo.res]:0,s:sk||''});return id},
  remove(id){const i=this.list.findIndex(d=>d.id===id);if(i<0)return null;const d=this.list[i];World.scene.remove(d.m);this.list.splice(i,1);return d},
  clear(){this.list.forEach(d=>World.scene.remove(d.m));this.list=[]},
  c4(){return this.list.find(d=>d.w==='c4')||null},
  near(p,r){let b=null,bd=r;for(const d of this.list){const e=Math.hypot(d.x-p.x,d.z-p.z);if(e<bd){bd=e;b=d}}return b},
  take(d,who){const isN=d.w==='frag'||d.w==='flash'||d.w==='smoke';
    if(isN){const cap=d.w==='flash'?2:1;if(who.isPlayer){if(who.nades[d.w]>=cap){Game.hint('Você já tem essa granada');return}}else if(who.remote||!who.gn||who.gn[d.w]>=cap)return}
    if(!this.remove(d.id))return;
    if(who.isPlayer){const P=Player;
      if(isN){P.nades[d.w]++;Snd.tone(420,.05,.08);HUDui.dirty=true;return}
      if(d.w==='c4'){P.loadout.c4='c4';Game.c4h=P}
      else{const w=W[d.w],key=w.slot===1?'primary':'pistol';if(P.loadout[key])P.dropItem(P.loadout[key],true,true);
        P.loadout[key]=d.w;P.ammo[d.w]=d.a?{mag:d.a.mag,res:d.a.res}:{mag:w.mag,res:w.res};P.equip(d.w)}
      Snd.tone(420,.05,.08)}
    else if(isN){who.gn[d.w]++;who.nd=who.gn.frag}
    else if(d.w==='c4')Game.c4h=who;
    else if(W[d.w]&&(W[d.w].slot===1||W[d.w].slot===2)){who.wid=d.w;who.m.setWeapon(d.w,defSkin(d.w))}
    if(Online.room)Online.ev({t:'pk',i:d.id})},
  deathDrop(p){const x=p.pos.x,z=p.pos.z,sc=()=>rnd(-.8,.8);
    if(p.isPlayer){const ls=p.loadout;
      if(ls.c4){this.drop('c4',x,z,null,true);ls.c4=null;if(Game.c4h===p)Game.c4h=null}
      if(ls.primary)this.drop(ls.primary,x+.4,z,p.ammo[ls.primary],true,(skinOf(ls.primary)||{}).id);
      if(ls.pistol&&ls.pistol!=='glock'&&ls.pistol!=='usp')this.drop(ls.pistol,x-.4,z+.3,p.ammo[ls.pistol],true,(skinOf(ls.pistol)||{}).id);
      for(const t of['frag','flash','smoke']){for(let i=0;i<(p.nades[t]||0);i++)this.drop(t,x+sc(),z+sc(),null,false,null);p.nades[t]=0}}
    else if(!p.remote){if(Game.c4h===p){this.drop('c4',x,z,null,true);Game.c4h=null}
      const w=p.wid;if(w&&W[w]&&W[w].slot===1)this.drop(w,x+.4,z,null,true,defSkin(w));
      for(const t of['frag','flash','smoke']){for(let i=0;i<(p.gn[t]||0);i++)this.drop(t,x+sc(),z+sc(),null,false,null);p.gn[t]=0}p.nd=0}},
  update(dt){if(Game.mode!=='game')return;const P=Player;
    this.cur=P.alive?this.near(P.pos,1.8):null;const pb=document.querySelector('.hbtn[data-id=pick]');if(pb)pb.classList.toggle('near',!!this.cur);
    const cd=this.c4();if(cd&&!Game.c4h)for(const b of Game.bots)if(b.team==='T'&&b.alive&&!b.remote&&Math.hypot(b.pos.x-cd.x,b.pos.z-cd.z)<1.4){this.take(cd,b);break}
    {const val=w=>(w.cat||(w.kind==='pistol'?1:0))*100000+(w.price||0);      // categoria primeiro (pistola<SMG<rifle), depois preço
     for(const b of Game.bots){if(!b.alive||b.remote||b.noPick>0||b.vis||b.act||!W[b.wid])continue;
      const cw=W[b.wid],cv=val(cw);let q=null,qv=cv;
      for(const e of this.list){const ew=W[e.w];if(!ew||(ew.slot!==1&&ew.slot!==2)||Math.hypot(e.x-b.pos.x,e.z-b.pos.z)>=1.4)continue;
        const v=val(ew);if(v>qv){q=e;qv=v}}
      if(!q)continue;
      if(cw.slot===1||cw.slot===2)this.drop(b.wid,b.pos.x+.8,b.pos.z,null,true,defSkin(b.wid));   // larga a arma atual no chão

function rankOf(rp, cm, id) {
  if (!cm) return { n: 'Sem patente', c: '#8a8f96', ic: null };
  if (rp >= 30000) {
    const im = (n, c) => ({ n, c, ic: 'imortal', t: 1, rp: 30000 });
    if (!Online.top100Data) return im('Imortal', '#eaf4ff');
    const idx = Online.top100Data.findIndex(x => x.id === id);
    if (idx >= 0 && idx < 10) return im('Imortal Top 10', '#ff2e63');
    if (idx >= 10 && idx < 50) return im('Imortal Top 50', '#ffb02e');
    if (idx >= 50 && idx < 100) return im('Imortal Top 100', '#b25cff');
    return im('Imortal', '#eaf4ff');
  }
  for (let i = 0; i < RANKS.length; i++) {
    if (rp >= RANKS[i].rp) return RANKS[i];
  }
  return RANKS[RANKS.length - 1];
}

function award(st,won,k,h,obj,mvp){
  const o=Game.opts;
  let xp=0, coins=0, rp=0;
  if(won) xp += 200;
  xp += k * 15;
  xp += h * 5;
  if(obj) xp += 100;
  let mult = o.mode === 'rank' ? 1.5 : o.mode === 'treino' ? 0.5 : 1.0;
  xp = Math.floor(xp * mult);
  if(o.mode !== 'treino') {
      if(won) coins += 300;
      coins += Math.min(30, k) * 10;
      if(obj) coins += 200;
      if(mvp) coins += 200;
  }
  let bonus=null;                                   // bônus em partida contra bots muito difíceis
  if(o.diff==='muito_dificil'&&o.mode!=='treino'){const x0=xp,c0=coins;xp=Math.floor(xp*1.3);coins=Math.floor(coins*1.2);bonus={xp:xp-x0,coins:coins-c0}}
  if(o.mode === 'rank') {
      if(won) rp += 100 + (mvp ? 20 : 0);
      else rp -= (st.rp >= 5000 ? 30 : 15);
  }
  st.xp += xp;
  st.coins += coins;
  st.rp = Math.max(0, st.rp + rp);
  if(o.mode === 'rank') st.cm++;
  st.matches++; if(won) st.wins++; st.kills += k;
  let ranks=[];                                     // recompensas acumulativas (só ranqueado em temporada ativa)
  /* recompensas de patente agora são resgatadas manualmente na Grade de Patentes */
  Store.set('stats', st);
  if(ranks.length)Online.checkExpired();
  Online.sync();
  return { xp, coins, rp, bonus, ranks };
}

  install(){const G=Game,N=Nade,me=this,f2=n=>+n.toFixed(2);
    const pl=G.plant;G.plant=function(p,by){const ok=this.bomb.state==='idle';pl.call(this,p,by);if(ok&&by&&by.isPlayer)me.ev({t:'pl',x:f2(p.x),z:f2(p.z)})};

    const th=N.throw;N.throw=function(ow,ty,o,v){th.call(this,ow,ty,o,v);if(ow&&ow.isPlayer)me.ev({t:'nd',ty,o:[f2(o.x),f2(o.y),f2(o.z)],v:[f2(v.x),f2(v.y),f2(v.z)]})};

    const tr=FX.tracer;FX.tracer=function(a,b){tr.call(this,a,b);if(me.room&&!me._rx)me.ev({t:'sh',a:[f2(a.x),f2(a.y),f2(a.z)],b:[f2(b.x),f2(b.y),f2(b.z)]})}}

/* ---------------- Amigos: pedidos REAIS via Firebase (pendente → aceito) ----------------
   friendReq/<destino>/<origem> = {n,ts}   → caixa de entrada de pedidos do jogador "destino"
   friendEv/<origem>/<destino>  = {t:'acc'|'rm',ts} → aviso entregue a quem enviou (aceitou / removeu)
   players/<meuId>.fr = IDs aceitos (lista oficial) · .pq = IDs com pedido enviado ainda pendente
   O jogador só entra na lista de amigos quando o OUTRO aceita; os dois lados são gravados na nuvem. */
const Friends={inbox:[],names:{},ui:null,
  reqs(){return Store.get('frReq',[])},
  list(){return Store.get('friends',[])},
  pending(){return this.reqs().filter(r=>r.state==='pending')},
  async name(id){if(this.names[id])return this.names[id];const f=await Online.info(id);return this.names[id]=f&&f.n?esc(f.n):'Jogador'},
  refresh(){const b=document.getElementById('lbFr');if(b)b.textContent='AMIGOS'+(this.inbox.length?' ('+this.inbox.length+')':'');if(this.ui)this.ui()},
  setInbox(v){this.inbox=Object.entries(v||{}).map(([id,r])=>({id,n:esc((r&&r.n)||'Jogador'),ts:(r&&r.ts)||0})).sort((a,b)=>b.ts-a.ts);this.refresh()},
  async send(raw){const id=(raw||'').trim(),me=Online.pid;
    if(!/^\d{8}$/.test(id))return{ok:false,msg:'ID inválido (8 dígitos).'};
    if(id===me)return{ok:false,msg:'Esse é o seu ID.'};
    if(this.list().includes(id))return{ok:false,msg:'Esse jogador já é seu amigo.'};
    if(this.pending().some(r=>r.id===id))return{ok:false,msg:'Pedido já enviado — aguardando resposta.'};
    if(!Online.ok||!Online.user)return{ok:false,msg:'Entre na sua conta para enviar pedidos.'};
    const f=await Online.info(id);if(!f)return{ok:false,msg:'Jogador não encontrado.'};
    if(this.inbox.some(r=>r.id===id)){const r=await this.accept(id);return r.ok?{ok:true,msg:esc(f.n)+' já tinha te enviado um pedido — agora vocês são amigos!'}:r}
    try{await Online.db.ref('friendReq/'+id+'/'+me).set({n:S.name||'Player',ts:firebase.database.ServerValue.TIMESTAMP})}
    catch(e){return{ok:false,msg:'Não foi possível enviar o pedido (conexão ou regras do Firebase).'}}
    const rs=this.reqs().filter(r=>r.id!==id);rs.push({id,n:f.n||'Jogador',state:'pending',ts:Date.now()});Store.set('frReq',rs);   // NÃO entra na lista de amigos
    Online.sync();return{ok:true,msg:'Pedido enviado para '+esc(f.n)+' · PENDENTE'}},
  async accept(id){const me=Online.pid;if(!this.inbox.some(r=>r.id===id))return{ok:false,msg:'Pedido não encontrado.'};
    try{await Online.db.ref('friendEv/'+id+'/'+me).set({t:'acc',ts:firebase.database.ServerValue.TIMESTAMP});await Online.db.ref('friendReq/'+me+'/'+id).remove()}
    catch(e){return{ok:false,msg:'Erro de conexão. Tente de novo.'}}
    const f=this.list();if(!f.includes(id)){f.push(id);Store.set('friends',f)}                    // só aqui vira amigo oficial
    const n=await this.name(id);await Online.sync();return{ok:true,n,msg:n+' agora é seu amigo!'}},
  async decline(id){try{await Online.db.ref('friendReq/'+Online.pid+'/'+id).remove();await Online.db.ref('friendEv/'+id+'/'+Online.pid).set({t:'dec',ts:firebase.database.ServerValue.TIMESTAMP})}catch(_){}},   // avisa quem enviou
  async cancel(id){try{await Online.db.ref('friendReq/'+id+'/'+Online.pid).remove()}catch(_){}
    Store.set('frReq',this.reqs().filter(r=>!(r.id===id&&r.state==='pending')));try{await Online.sync()}catch(_){}},
  async remove(id){Store.set('friends',this.list().filter(x=>x!==id));Store.set('frReq',this.reqs().filter(r=>r.id!==id));
    try{await Online.db.ref('friendEv/'+id+'/'+Online.pid).set({t:'rm',ts:firebase.database.ServerValue.TIMESTAMP})}catch(_){}
    try{await Online.sync()}catch(_){}},
  events(v){let ch=false;                                       // avisos que chegaram para mim: aceite ou remoção
    for(const [from,e] of Object.entries(v||{})){const t=e&&e.t;
      if(t==='acc'&&this.pending().some(r=>r.id===from)){const rs=this.reqs();rs.forEach(r=>{if(r.id===from)r.state='accepted'});Store.set('frReq',rs);
        const f=this.list();if(!f.includes(from)){f.push(from);Store.set('friends',f)}ch=true}
      else if(t==='rm'&&this.list().includes(from)){Store.set('friends',this.list().filter(x=>x!==from));ch=true}
      else if(t==='dec'&&this.pending().some(r=>r.id===from)){Store.set('frReq',this.reqs().filter(r=>r.id!==from));ch=true}   // pedido recusado/cancelado
      try{Online.db.ref('friendEv/'+Online.pid+'/'+from).remove()}catch(_){}}
    if(ch){try{Online.sync()}catch(_){}this.refresh()}}
};

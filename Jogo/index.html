      $('#ldMap').textContent=(MN[o.map]||'Dunas').toUpperCase();$('#ldMode').textContent='PARTY · ONLINE';$('#ldTxt').textContent='Entrando na partida do líder…';$('#ldBar').style.width='100%';
      const L=$('#loading');L.classList.remove('hidden');
      setTimeout(()=>{$('#menu').classList.add('hidden');L.classList.add('hidden');Online.setIg(1);Game.start(Object.assign({},o,{room:{rid:go.rid,me,others:pl.filter(x=>x.pid!==me.pid),host:i.host,party:true}}))},700)}catch(e){Pmsg('Não foi possível entrar na partida.')}},
  inv(){const tabs=[['skins','SKINS'],['agents','PERSONAGENS'],['avatars','AVATARES'],['nades','GRANADAS']];
    if(!tabs.some(t=>t[0]===this.itab))this.itab='skins';
    const wf=[['all','TODAS'],['rifle','RIFLES'],['pistol','PISTOLAS'],['sniper','SNIPERS'],['knife','FACAS']];
    const f=s=>{const k=W[s.w].kind;return this.iw==='all'||(this.iw==='rifle'&&['rifle','smg','shotgun'].includes(k))||this.iw===k};
    const sk=SKINS.filter(isOwned),gs=GSKINS.filter(isOwned);let body='';
    if(this.itab==='skins'){
      body=`<div class="tabs" style="margin-bottom:6px">${wf.map(t=>`<button data-w="${t[0]}" class="${this.iw===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div class="inv">${sk.filter(f).sort((a,b)=>tierOf(a)-tierOf(b)).map(s=>{const eq=skinOf(s.w)===s;return`<div class="item ${eq?'eq':''}" style="--rc:${s.rc}"><div class="sk"><img src="${Thumb.weapon(s.id)}" alt=""></div><small>${W[s.w].name}</small><b>${s.n}</b><small style="color:${s.rc}">${s.r}</small><div class="bb"><button data-e="${s.id}">${eq?'EQUIPADO':'EQUIPAR'}</button><button data-i="${s.id}">INSPECIONAR</button></div></div>`}).join('')}</div>`}
    else if(this.itab==='agents'){
      const fig=(a,t)=>`<img class="fg" src="${Thumb.agent(t,a.id)}" alt="">`;
      body=['T','CT'].map(t=>`<div class="ag-h" style="color:${t==='T'?'var(--gold)':'var(--blue)'}">${t==='T'?'AGENTES TERRORISTAS':'AGENTES CONTRA-TERRORISTAS'}</div><div class="ags">${AGENTS[t].filter(isOwnedAg).sort((a,b)=>a.t-b.t).map(a=>{const e=eqAgent[t]===a.id;return`<div class="ag ${e?'eq':''}" data-t="${t}" data-a="${a.id}" style="border-bottom:3px solid ${RAR[a.t][1]}">${e?'<em>EQUIPADO</em>':''}${fig(a,t)}<b>${a.name}</b><small style="color:${RAR[a.t][1]}">${RAR[a.t][0]}</small><button class="btn" data-ver="${t}:${a.id}" style="padding:3px 8px;font-size:9px;margin-top:4px">VER 3D</button></div>`}).join('')}</div>`).join('')}
    else if(this.itab==='avatars'){
      const cur=Store.get('avatar','')||'a0',ow=Store.get('owned',[]),ex=Store.get('avExp',{}),now=Date.now(),L=[];
      AVATARS.forEach((e,n)=>{if(n===0||ow.includes('av'+n))L.push({id:'a'+n,h:e,nm:AV_NAMES[n]})});
      Object.keys(Online.cav).forEach(k=>{if(ow.includes('c_'+k))L.push({id:'c_'+k,h:esc(Online.cav[k].e),nm:esc(Online.cav[k].n)})});
      AVR.forEach((ic,i)=>{const left=(+ex[ic]||0)-now;if(left>0)L.push({id:'r_'+ic,h:rkIcon(avRank(ic),44),nm:RK_NAME[i],sub:Math.ceil(left/864e5)+' dia(s) restantes'})});
      body=`<div class="inv">${L.map(a=>`<div class="item ${cur===a.id?'eq':''}" style="--rc:#9aa5b1"><div class="sk" style="height:64px;display:flex;align-items:center;justify-content:center;font-size:40px">${a.h}</div><b>${a.nm}</b>${a.sub?`<small>${a.sub}</small>`:''}<div class="bb"><button data-eav="${a.id}">${cur===a.id?'EQUIPADO':'EQUIPAR'}</button></div></div>`).join('')}</div>`}
    else body=`<div class="inv">${gs.sort((a,b)=>tierOf(a)-tierOf(b)).map(gCard).join('')}</div>`;
    $('#menuMain').innerHTML=`<h2>INVENTÁRIO<small>${sk.length+gs.length} itens · 🪙 ${myStats().coins} moedas</small><button class="btn back" id="bkLb">✕ VOLTAR</button></h2><div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${this.itab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${body}`;
    $('#bkLb').onclick=()=>this.go('play','lobby');
    $$('.tabs button[data-t]').forEach(b=>b.onclick=()=>{this.itab=b.dataset.t;this.inv()});
    $$('.tabs button[data-w]').forEach(b=>b.onclick=()=>{this.iw=b.dataset.w;this.inv()});
    $$('[data-e]').forEach(b=>b.onclick=()=>{const s=SKINS.find(x=>x.id===b.dataset.e);eqSkins[s.w]=s.id;Store.set('skins',eqSkins);this.inv()});
    $$('[data-ig]').forEach(b=>b.onclick=()=>Thumb.inspectNade(b.dataset.ig,()=>this.inv()));
    $$('[data-eg]').forEach(b=>b.onclick=()=>{const g=GSKINS.find(x=>x.id===b.dataset.eg);eqG[g.g]=g.id;Store.set('gskin',eqG);this.inv()});
    $$('[data-i]').forEach(b=>b.onclick=()=>Thumb.inspect(b.dataset.i,()=>this.inv()));
    $$('[data-eav]').forEach(b=>b.onclick=()=>{Store.set('avatar',b.dataset.eav);Online.sync();this.inv()});
    $$('[data-ver]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [t,id]=b.dataset.ver.split(':');Thumb.inspectAgent(t,id,()=>this.inv())});
    $$('.ag[data-a]').forEach(el=>el.onclick=()=>{eqAgent[el.dataset.t]=el.dataset.a;Store.set('agent',eqAgent);Lobby.setTeam(el.dataset.t);this.inv()})},
  schema:{
    video:[['quality','Qualidade gráfica','sel',[['baixa','Baixa'],['media','Média'],['alta','Alta']]],['scale','Escala de renderização','rng',50,100,5,'%'],['shadows','Sombras','bool'],['fov','Campo de visão (FOV)','rng',60,110,1,'°'],['fps','Mostrar FPS','bool']],
    audio:[['vol','Volume geral','rng',0,100,5,'%'],['sfx','Volume de efeitos','rng',0,100,5,'%']],
    game:[['sens','Sensibilidade da mira','rng',.3,3,.05,''],['crouchToggle','Agachar: alternar (em vez de segurar)','bool'],['xShape','Formato da mira','sel',[['classic','Clássica (4 riscos)'],['circle','Círculo'],['square','Quadrado'],['dot','Ponto']]],['xColor','Cor da mira','col'],['xSize','Tamanho da mira','rng',2,14,1,''],['xGap','Espaço central','rng',0,12,1,''],['xThick','Espessura','rng',1,5,1,''],['xDot','Ponto central','bool'],['xDyn','Mira dinâmica (abre ao mover/atirar)','bool']],
    ctrl:[]},
  set(){const tabs=[['video','VÍDEO'],['audio','ÁUDIO'],['game','JOGABILIDADE'],['ctrl','CONTROLES']];
    const rows=this.schema[this.stab].map(([k,l,t,a,b,c,u])=>{let ctl='';
      if(t==='rng')ctl=`<input type="range" data-k="${k}" min="${a}" max="${b}" step="${c}" value="${S[k]}"><span class="v" id="v_${k}">${S[k]}${u}</span>`;
      else if(t==='bool')ctl=`<button class="sw ${S[k]?'on':''}" data-k="${k}"></button>`;
      else if(t==='sel')ctl=`<select data-k="${k}">${a.map(o=>`<option value="${o[0]}" ${S[k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
      else if(t==='txt')ctl=`<input type="text" data-k="${k}" maxlength="14" value="${S[k]}">`;
      else if(t==='col')ctl=`<div class="cols">${['#7CFC00','#ffffff','#33e0ff','#ffe014','#ff3df0','#ff3b30'].map(c=>`<i data-k="${k}" data-c="${c}" class="${S[k]===c?'on':''}" style="background:${c}"></i>`).join('')}</div>`;
      return`<div class="row"><span>${l}</span>${ctl}</div>`}).join('');
    const extra=this.stab==='ctrl'?`<div class="row"><span>Layout dos botões</span><button class="btn g" id="edHud">EDITAR LAYOUT DA HUD</button></div><div class="row"><span>Posições salvas</span><button class="btn" id="rsHud">RESTAURAR PADRÃO</button></div>`:'';
    $('#menuMain').innerHTML=`<div class="panel"><h2>CONFIGURAÇÕES</h2><div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${this.stab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${rows}${extra}
      <div class="foot"><button class="btn" id="rsDef">RESTAURAR PADRÃO</button><div><button class="btn" id="stBack">VOLTAR</button> <button class="btn g" id="stApply">APLICAR</button></div></div><button class="btn out" id="stLogout">⏻ DESLOGAR</button></div>`;
    const live=()=>{saveS();applyVideo();HUD.apply();HUDui.crosshair()};
    $$('.tabs button').forEach(b=>b.onclick=()=>{this.stab=b.dataset.t;this.set()});
    $$('#menuMain input[type=range]').forEach(i=>i.oninput=()=>{S[i.dataset.k]=+i.value;const u=this.schema[this.stab].find(r=>r[0]===i.dataset.k)[6];$('#v_'+i.dataset.k).textContent=i.value+u;live()});
    $$('#menuMain .sw').forEach(i=>i.onclick=()=>{S[i.dataset.k]=!S[i.dataset.k];i.classList.toggle('on',S[i.dataset.k]);live()});
    $$('#menuMain select').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.value;live()});
    $$('#menuMain input[type=text]').forEach(i=>i.oninput=()=>{S[i.dataset.k]=i.value||'Player';live()});
    $$('#menuMain .cols i').forEach(i=>i.onclick=()=>{S[i.dataset.k]=i.dataset.c;live();this.set()});
    $('#rsDef').onclick=()=>{Object.assign(S,DEF);live();this.set()};
    $('#stBack').onclick=$('#stApply').onclick=()=>{live();this.go('play')};
    $('#stLogout').onclick=()=>this.logout();
    if($('#edHud')){$('#edHud').onclick=()=>HUD.startEdit(false);$('#rsHud').onclick=()=>{HUD.pos={};S.hudSize=DEF.hudSize;S.hudOpacity=DEF.hudOpacity;Store.set('hudpos',{});saveS();HUD.apply()}}},
  shop(){const st=myStats(),msg=this.smsg||'',sc=$('#menuMain').scrollTop,so=Online.shopOn,ow=Store.get('owned',[]);this.smsg='';const it=[];
    /* a loja começa vazia: só entra o que o ADM liberou (on:1 no Firebase) */
    SKINS.forEach(s=>{if(s.n!=='Default'&&so.sk[s.id])it.push({k:'w',s,t:tierOf(s),p:skinPrice(s)})});
    GSKINS.forEach(s=>{if(s.n!=='Default'&&so.sk[s.id])it.push({k:'g',s,t:tierOf(s),p:skinPrice(s)})});
    ['T','CT'].forEach(tm=>AGENTS[tm].forEach(a=>{if(a.t>0&&so.ag[a.id])it.push({k:'a',s:a,tm,t:a.t,p:a.price||PRICE[a.t]})}));
    Object.keys(so.av).forEach(id=>{const c=Online.cav[id];if(c)it.push({k:'v',s:Object.assign({id},c),t:0,p:c.price})});
    it.sort((a,b)=>a.t-b.t||a.p-b.p);
    const card=x=>{const s=x.s;let own,col,rn,nm,img,sub;
      if(x.k==='v'){own=ow.includes('c_'+s.id);col='#9aa5b1';rn='Avatar';nm=esc(s.n);img=`<span style="font-size:42px">${esc(s.e)}</span>`;sub='Avatar'}
      else{own=x.k==='a'?isOwnedAg(s):isOwned(s);col=x.k==='a'?RAR[s.t][1]:s.rc;rn=x.k==='a'?RAR[s.t][0]:s.r;nm=x.k==='a'?s.name:s.n;
        if(x.k==='w'){img=`<img src="${Thumb.weapon(s.id)}" alt="">`;sub=W[s.w].name}else if(x.k==='g'){img=gPrev(s);sub=GN[s.g]}else{img=`<img src="${Thumb.agent(x.tm,s.id)}" alt="" style="height:96px">`;sub='Personagem '+x.tm}}
      const btn=own?'<button disabled>✔ NA POSSE</button>':`<button data-b="${x.k}:${s.id}" data-tm="${x.tm||''}" style="color:#e8c04a">🪙 ${x.p}</button>`;
      return`<div class="item" style="--rc:${col}"><div class="sk" style="${x.k==='a'?'height:100px':x.k==='v'?'height:70px;display:flex;align-items:center;justify-content:center':''}">${img}</div><small>${sub}</small><b>${nm}</b><small style="color:${col}">${rn}</small><div class="bb">${btn}${x.k==='v'?'':`<button data-v="${x.k}:${s.id}:${x.tm||''}">VER</button>`}</div></div>`};
    $('#menuMain').innerHTML=`<h2>LOJA<small>🪙 ${st.coins} moedas${msg?' · '+msg:''}</small><button class="btn back" id="bkLb">✕ VOLTAR</button></h2>${it.length?`<div class="inv">${it.map(card).join('')}</div>`:'<div class="panel" style="text-align:center;color:var(--mut)">🛒 Nenhum item disponível na loja no momento.<br><small>Volte mais tarde — novos itens aparecem quando forem liberados.</small></div>'}`;
    $('#menuMain').scrollTop=sc;$('#bkLb').onclick=()=>this.go('play','lobby');
    $$('[data-b]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.b.split(':');const ok=k==='v'?buyCAvatar(id):k==='a'?buyAgent(AGENTS[b.dataset.tm].find(x=>x.id===id)):buySkin((k==='g'?GSKINS:SKINS).find(x=>x.id===id));this.smsg=ok?'Comprado!':'Moedas insuficientes';this.shop()});
    $$('[data-v]').forEach(b=>b.onclick=()=>{const [k,id,tm]=b.dataset.v.split(':'),cb=()=>this.shop();k==='w'?Thumb.inspect(id,cb):k==='a'?Thumb.inspectAgent(tm,id,cb):Thumb.inspectNade(id,cb)})},
  mailReward(id){   // prévia visual do prêmio (arma/faca, granada ou personagem)
    const sk=SKINS.find(x=>x.id===id),gk=GSKINS.find(x=>x.id===id),tm=AGENTS.T.find(a=>a.id===id)?'T':(AGENTS.CT.find(a=>a.id===id)?'CT':null);
    try{
      if(sk)return{img:`<img src="${Thumb.weapon(sk.id)}" alt="" style="height:64px;max-width:130px;object-fit:contain">`,nm:W[sk.w].name+' | '+sk.n,r:sk.r,rc:sk.rc};
      if(gk)return{img:`<img src="${Thumb.nadeSkin(gk.id)}" alt="" style="height:72px;object-fit:contain">`,nm:GN[gk.g]+' | '+gk.n,r:gk.r,rc:gk.rc};
      if(tm){const a=AGENTS[tm].find(x=>x.id===id),ra=RAR[a.t]||['',''];return{img:`<img src="${Thumb.agent(tm,id)}" alt="" style="height:96px;object-fit:contain">`,nm:a.name,r:'Personagem '+tm+(ra[0]?' · '+ra[0]:''),rc:ra[1]||'#e8c04a'}}
    }catch(e){}
    return{img:'<span style="font-size:28px">🎁</span>',nm:id,r:'',rc:'#e8c04a'}},
  mail(){const all=Online.mails||[],ns=(Online.notices||[]).slice().reverse(),d=t=>t?new Date(t).toLocaleDateString('pt-BR'):'',
      ids=m=>String(m.skins||m.skin||'').split(',').filter(Boolean),
      ms=all.filter(m=>!((m.coins||ids(m).length)&&m.c));      // mensagem com prêmio coletado some da caixa
    $('#menuMain').innerHTML=`<h2>CORREIO<small>${ms.length} mensagens</small><button class="btn back" id="bkLb">✕ VOLTAR</button></h2>
    ${ns.length?'<div class="ag-h">AVISOS</div>'+ns.map(n=>`<div class="panel" style="margin-bottom:6px"><b>📢 ${esc(n.t)}</b><div style="font-size:12px;color:var(--mut);white-space:pre-wrap">${esc(n.b)}</div></div>`).join(''):''}
    <div class="ag-h">MENSAGENS</div>${ms.length?ms.map(m=>{const sl=ids(m),has=m.coins||sl.length;
      return`<div class="panel" style="margin-bottom:6px;${m.r?'':'border-left:3px solid var(--gold)'}"><b>${esc(m.t)}</b> <small style="color:var(--mut)">${d(m.ts)}</small><div style="font-size:12px;color:var(--mut);white-space:pre-wrap;margin:4px 0">${esc(m.b)}</div>
        ${has?`<div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:6px 0">${m.coins?`<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line)"><span style="font-size:22px">🪙</span><b>${esc(m.coins)}</b><small style="color:var(--mut)">moedas</small></div>`:''}${sl.map(id=>{const rw=this.mailReward(id);return`<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border:1px solid var(--line);border-bottom:2px solid ${rw.rc}">${rw.img}<div><b style="display:block">${esc(rw.nm)}</b><small style="color:${rw.rc}">${esc(rw.r)}</small></div></div>`}).join('')}</div><button class="btn g" data-cl="${m.id}">COLETAR</button>`:''}</div>`}).join(''):'<small style="color:var(--mut)">Nenhuma mensagem.</small>'}`;
    $('#bkLb').onclick=()=>this.go('play','lobby');
    $$('[data-cl]').forEach(b=>b.onclick=async()=>{b.disabled=true;await Online.claim(b.dataset.cl);this.mail()});
    ms.filter(m=>!m.r).forEach(m=>Online.db.ref('mail/'+Online.pid+'/'+m.id+'/r').set(1).catch(()=>{}))},
  exit(){$('#menuMain').innerHTML=`<div class="panel" style="text-align:center"><h2>SAIR</h2><p style="color:var(--mut)">Você pode fechar a aba ou o aplicativo a qualquer momento.<br>Suas configurações, layout da HUD e inventário ficam salvos neste aparelho.</p><button class="btn g" id="bk">VOLTAR</button></div>`;$('#bk').onclick=()=>this.go('play')}
};

/* ---------------- Boot ---------------- */
function boot(){Online.init();Online.install();
  if(typeof THREE==='undefined'){document.body.innerHTML='<p style="padding:20px">Não foi possível carregar o Three.js (verifique a conexão).</p>';return}
  buildWorld();FX.init();Lobby.build();Controls.init();HUD.apply();
  $$('#nav [data-tab]').forEach(b=>b.onclick=()=>UI.go(b.dataset.tab));
  // Pausa
  $('#pResume').onclick=()=>Game.pause(false);
  $('#pEdit').onclick=()=>HUD.startEdit(true);
  $('#pQuit').onclick=()=>Game.quit();
  // Impede gestos nativos (zoom/scroll) fora de áreas rolláveis
  document.addEventListener('touchmove',e=>{if(!e.target.closest('#menuMain,#shopBox,.modal .box,#editBar,#chPanel,.pfm'))e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  World.camera.position.set(0,12,38);
  UI.go('play');Game.frame();
}
// Ao sair do editor vindo do jogo, o painel de pausa reaparece (stopEdit trata isso)
boot();
})();
</script>
